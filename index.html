<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <nav class="navbar">
        <div>
            <a href=""><img src="/images/skill up logo white.png" alt="" width="50"></a>
        </div>

        <ul class="nav-links">
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Gallery</a></li>
            <li><a href="">Contacts</a></li>
        </ul>
        <li class="dropdown">
            <a href="">Courses</a>

            <ul class="dropdown-content">
                <li><a href="">Web Development</a></li>
                <li><a href="">Graphics Design</a></li>
                <li><a href="">Cybersecurity</a></li>
                <li><a href="">Data Anaysis</a></li>
            </ul>
        </li>

        <!-- Calculator Icon -->
        <div class="calc-icon" id="calcToggle"><img src="/images/Calculator icon.png" alt="" width="50px"></div>


        <!-- Dropdown Calculator -->
        <div class="calculator-dropdown" id="calculator">

            <input type="text" id="display" readonly>

            <div class="buttons">

                <button class="number" onclick="appendValue('7')">7</button>
                <button class="number" onclick="appendValue('8')">8</button>
                <button class="number" onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('/')">÷</button>

                <button class="number" onclick="appendValue('4')">4</button>
                <button class="number" onclick="appendValue('5')">5</button>
                <button class="number" onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('*')">×</button>

                <button class="number" onclick="appendValue('1')">1</button>
                <button class="number" onclick="appendValue('2')">2</button>
                <button class="number" onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('-')">−</button>

                <button class="number" onclick="appendValue('0')">0</button>
                <button class="number" onclick="appendValue('.')">.</button>
                <button class="operator" onclick="appendValue('+')">+</button>
                <button class="operator" onclick="deleteLast()">⌫</button>

                <button class="clear" onclick="clearDisplay()">Clear</button>
                <button class="equal" onclick="calculate()">=</button>

            </div>

        </div>

        <a href="" class="btn">Sign Up</a>
    </nav>
    <video autoplay loop muted play-inline class="bg-video">
        <source src="/images/Instructor_teaching_students_lap…_202605081937.mp4">
    </video>

    <div class="overlay-bg"></div>

    <div class="Form-container">
        <h2>Student Login</h2>

        <form id="signupForm">

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <div class="error" id="nameError"></div>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
                <div class="error" id="emailError"></div>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="08012345678">
                <div class="error" id="phoneError"></div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password">
                <div class="error" id="passwordError"></div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
                <div class="error" id="confirmError"></div>
            </div>

            <button type="submit">Create Account</button>

            <div class="success" id="successMessage"></div>

        </form>

        <div class="login-link">
            Already have an account? <a href="#">Login</a>
        </div>

        <script src="index.js"></script>
    </div>
</body>

</html>
